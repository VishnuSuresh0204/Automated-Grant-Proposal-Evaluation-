<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal | National Certificate Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #f4f6f9;
    }

    .sidebar {
      width: 260px;
      background: #343a40;
      min-height: 100vh;
      color: #fff;
      position: fixed;
    }

    .sidebar-header {
      padding: 20px;
      background: #212529;
      border-bottom: 1px solid #4b545c;
    }

    .sidebar a {
      color: #c2c7d0;
      text-decoration: none;
      display: block;
      padding: 12px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      transition: 0.3s;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #007bff;
      color: #fff;
    }

    .sidebar a i {
      width: 25px;
    }

    .main-content {
      margin-left: 260px;
      padding: 20px;
    }

    .top-navbar {
      background: #fff;
      border-bottom: 1px solid #dee2e6;
      padding: 10px 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card {
      border-top: 3px solid #007bff;
      border-radius: 3px;
      box-shadow: 0 0 1px rgba(0, 0, 0, .125), 0 1px 3px rgba(0, 0, 0, .2);
    }

    .card-header {
      background-color: #fff;
      border-bottom: 1px solid rgba(0, 0, 0, .125);
      font-weight: bold;
    }

    .page-title {
      font-size: 1.5rem;
      color: #343a40;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>

  <div class="sidebar">
    <div class="sidebar-header d-flex align-items-center">
      <img
        src="https://upload.wikimedia.org/wikipedia/commons/thumb/5/55/Emblem_of_India.svg/330px-Emblem_of_India.svg.png"
        height="40" class="me-2">
      <span class="fs-5 fw-bold">Admin Portal</span>
    </div>
    <div class="mt-2">
      <!-- <a href="/admin_home/"><i class="fas fa-home"></i> Home</a> -->
      <a href="/admin_dashboard/"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
      <a href="/admin_view_authorities/"><i class="fas fa-user-tie"></i> Authorities</a>
      <a href="/admin_view_requests/"><i class="fas fa-file-alt"></i> Requests</a>
      <a href="/admin_view_feedback/"><i class="fas fa-comments"></i> Feedback</a>
      <a href="/logout/" class="text-danger mt-4 border-0"><i class="fas fa-sign-out-alt"></i> Logout</a>
    </div>
  </div>

  <div class="main-content">
    <div class="top-navbar">
      <h5 class="m-0 text-dark">Certificate Management System</h5>
      <div>
        <span class="me-3">Administrator</span>
        <i class="fas fa-user-circle fa-lg text-secondary"></i>
      </div>
    </div>

    {% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
